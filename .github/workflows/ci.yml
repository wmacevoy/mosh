name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # let every platform report, rather than stopping at the first to fail
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-24.04]
        crypto: [auto]
        include:
          - crypto: nettle
            os: ubuntu-22.04
        

    steps:
    - uses: actions/checkout@v2

    - name: "setup linux build environment"
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: sudo apt update && sudo apt install -y protobuf-compiler libprotobuf-dev libutempter-dev autoconf automake nettle-dev

    - name: "setup macos build environment"
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: brew install protobuf automake

    - name: "generate build scripts"
      run: ./autogen.sh

    - name: ${{ format('configure (crypto {0})', matrix.crypto) }}
      run: ./configure --enable-compile-warnings=error --enable-examples ${{ (matrix.crypto != 'auto' && format('--with-crypto-library={0}', matrix.crypto)) || '' }}

    - name: "build"
      run: make V=1

    - name: "test"
      run: make V=1 check || { cat src/tests/test-suite.log; exit 1; }

  # The whole test suite again, with the compiler checking every memory
  # access and every operation whose behaviour C++ leaves undefined.
  sanitizers:
    runs-on: ubuntu-24.04

    env:
      SANITIZE: -g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
    - uses: actions/checkout@v4

    - name: "setup build environment"
      run: sudo apt update && sudo apt install -y protobuf-compiler libprotobuf-dev libutempter-dev autoconf automake

    - name: "generate build scripts"
      run: ./autogen.sh

    - name: "configure"
      run: ./configure CXXFLAGS="$SANITIZE" CFLAGS="$SANITIZE" LDFLAGS="-fsanitize=address,undefined"

    - name: "build"
      run: make V=1

    - name: "port forwarding tests, also checking for leaks"
      run: make -C src/tests V=1 check TESTS="udp-forward tcp-in-udp tcp-forward forward-e2e.test"
      env:
        ASAN_OPTIONS: detect_leaks=1

    - name: "all tests"
      run: make V=1 check
      env:
        ASAN_OPTIONS: detect_leaks=0

    - name: "show the logs of anything that failed"
      if: failure()
      run: |
        cd src/tests
        for t in *.trs; do
          grep -q ':test-result: \(PASS\|SKIP\|XFAIL\)' "$t" || { echo "=== ${t%.trs}"; tail -n 100 "${t%.trs}.log"; }
        done

  # A short run of each fuzzer on every change: long enough to catch a
  # regression in what they already reach, not a substitute for running
  # them for hours.
  fuzz:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: "setup build environment"
      run: sudo apt update && sudo apt install -y clang protobuf-compiler libprotobuf-dev libutempter-dev autoconf automake

    - name: "generate build scripts"
      run: ./autogen.sh

    - name: "configure"
      run: >-
        ./configure --enable-fuzzing CC=clang CXX=clang++
        CXXFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined"
        LDFLAGS="-fsanitize=address,undefined"

    - name: "build"
      run: make V=1

    - name: "fuzz"
      run: |
        cd src/fuzz
        status=0
        for fuzzer in forward_frame_fuzzer tcpinudp_fuzzer udp_forward_fuzzer tcp_adapter_fuzzer file_copy_fuzzer terminal_parser_fuzzer terminal_fuzzer; do
          echo "::group::$fuzzer"
          corpus="${fuzzer%_fuzzer}_corpus"
          mkdir -p "work/$fuzzer" "crashes/$fuzzer"
          ./$fuzzer -max_total_time=60 -timeout=20 -rss_limit_mb=2048 -print_final_stats=1 \
            -artifact_prefix="crashes/$fuzzer/" "work/$fuzzer" $( [ -d "$corpus" ] && echo "$corpus" ) || status=1
          echo "::endgroup::"
        done
        exit $status
      env:
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    - name: "keep whatever made a fuzzer fail"
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes
        path: src/fuzz/crashes

  # The Windows client, built in MSYS2's POSIX environment (as MSYS2's own
  # mosh package is).  The result needs the MSYS2 runtime DLLs, which are
  # collected alongside it.
  msys2:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: "keep line endings as they are"
      shell: bash
      run: git config --global core.autocrlf false

    - uses: actions/checkout@v4

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MSYS
        update: true
        install: >-
          autotools
          gcc
          make
          pkgconf
          perl
          perl-doc
          python
          zip
          protobuf-devel
          ncurses-devel
          zlib-devel
          openssl-devel

    - name: "generate build scripts"
      run: ./autogen.sh

    - name: "configure"
      run: |
        export MSYSTEM=CYGWIN
        CXXFLAGS="-g -O2 -D_GNU_SOURCE" ./configure

    - name: "build"
      run: |
        export MSYSTEM=CYGWIN
        make V=1

    - name: "test"
      run: |
        export MSYSTEM=CYGWIN
        make -C src/tests V=1 check TESTS="ocb-aes encrypt-decrypt base64 nonce-incr udp-forward tcp-in-udp tcp-forward file-copy"

    - name: "collect the client and the libraries it needs"
      run: |
        mkdir -p dist/mosh-msys2
        cp src/frontend/mosh-client.exe src/frontend/mosh-server.exe scripts/mosh scripts/mocp dist/mosh-msys2/
        ldd src/frontend/mosh-client.exe src/frontend/mosh-server.exe | awk '$3 ~ /^\/usr\/bin\// { print $3 }' | sort -u | xargs -I{} cp {} dist/mosh-msys2/
        ls -l dist/mosh-msys2

    # From outside MSYS2, as someone without it installed would run it.
    # (Inside the MSYS2 shell, a second copy of its runtime DLL can't be used.)
    - name: "check that the collected client runs on its own"
      shell: pwsh
      run: .\dist\mosh-msys2\mosh-client.exe --version

    # The server too: a whole session, with nothing of MSYS2's but the
    # libraries collected beside the programs.
    - name: "check that a session works between the collected programs"
      shell: pwsh
      run: |
        .\dist\mosh-msys2\mosh-server.exe --version
        python src\tests\headless-smoke.py dist\mosh-msys2\mosh-server.exe dist\mosh-msys2\mosh-client.exe
        python src\tests\headless-smoke.py dist\mosh-msys2\mosh-server.exe dist\mosh-msys2\mosh-client.exe ::1
        python src\tests\headless-smoke.py dist\mosh-msys2\mosh-server.exe dist\mosh-msys2\mosh-client.exe 127.0.0.1 always
        python src\tests\headless-smoke.py dist\mosh-msys2\mosh-server.exe dist\mosh-msys2\mosh-client.exe 127.0.0.1 blocked
        python src\tests\headless-smoke.py dist\mosh-msys2\mosh-server.exe dist\mosh-msys2\mosh-client.exe 127.0.0.1 translated

    - uses: actions/upload-artifact@v4
      with:
        name: mosh-client-msys2
        path: dist/mosh-msys2
