name: CodeQL

# Static analysis of the C++.  Findings appear under the repository's
# Security tab, "Code scanning".

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@v4

    - uses: github/codeql-action/init@v3
      with:
        languages: c-cpp
        build-mode: manual
        queries: security-extended

    - name: "setup build environment"
      run: sudo apt update && sudo apt install -y protobuf-compiler libprotobuf-dev libutempter-dev autoconf automake

    - name: "build"
      run: |
        ./autogen.sh
        ./configure
        make

    - uses: github/codeql-action/analyze@v3
      with:
        category: "/language:c-cpp"
