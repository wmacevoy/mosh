name: Release

# Builds what a release consists of, and on a version tag publishes it
# as a GitHub pre-release:
#
#   mosh-VERSION.tar.gz                  source
#   mosh-VERSION-linux-x86_64.tar.gz     programs needing only the C library
#   mosh-VERSION-linux-aarch64.tar.gz      (glibc 2.31 or newer)
#   mosh-VERSION-msys2.zip               Windows client with the MSYS2 runtime
#   install.sh                           installer for the Linux packages
#   SHA256SUMS
#
# To release: set the version in configure.ac's AC_INIT, commit, and
# push a tag named mosh-VERSION.  Started by hand instead, it builds
# everything and publishes nothing, as a rehearsal.

on:
  push:
    tags:
      - "mosh-*-pf.*"
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: "what version is this?"
      id: version
      run: |
        version=$(sed -n 's/^AC_INIT(\[[^]]*\], \[\([^]]*\)\].*/\1/p' configure.ac)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Version $version"
        if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "mosh-$version" ]; then
          echo "::error::the tag is $GITHUB_REF_NAME but configure.ac says mosh-$version"
          exit 1
        fi

    - name: "setup build environment"
      run: sudo apt update && sudo apt install -y protobuf-compiler libprotobuf-dev libutempter-dev autoconf automake

    - name: "make the source package"
      run: |
        ./autogen.sh
        ./configure
        make dist
        mkdir dist
        mv mosh-${{ steps.version.outputs.version }}.tar.gz dist/

    - name: "check that the source package builds and passes its tests"
      run: |
        mkdir try && tar -xzf dist/mosh-${{ steps.version.outputs.version }}.tar.gz -C try
        cd try/mosh-${{ steps.version.outputs.version }}
        ./configure
        make
        make -C src/tests check TESTS="udp-forward tcp-in-udp tcp-forward forward-e2e.test"

    - uses: actions/upload-artifact@v4
      with:
        name: source
        path: dist/

  # Built on an old Debian so that the result runs on anything newer,
  # with every library but the C library linked in.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    container: debian:11

    steps:
    - name: "setup build environment"
      run: |
        apt-get update
        apt-get install -y --no-install-recommends g++ make autoconf automake pkg-config perl perl-doc \
          protobuf-compiler libprotobuf-dev libncurses-dev libssl-dev zlib1g-dev \
          python3 ca-certificates file binutils

    - uses: actions/checkout@v4

    - name: "build"
      run: |
        ./autogen.sh
        ./configure --enable-static-libraries --without-utempter
        make

    - name: "test"
      run: make check
      env:
        LC_ALL: C.UTF-8

    - name: "package"
      run: scripts/package-linux.sh dist

    - name: "check what the programs need from the system"
      run: |
        for program in src/frontend/mosh-client src/frontend/mosh-server; do
          file "$program"
          ldd "$program"
          newest=$(objdump -T "$program" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)
          echo "$program needs up to $newest"
        done

    - uses: actions/upload-artifact@v4
      with:
        name: linux-${{ matrix.arch }}
        path: dist/

  msys2:
    runs-on: windows-latest
    needs: source

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: "keep line endings as they are"
      shell: bash
      run: git config --global core.autocrlf false

    - uses: actions/checkout@v4

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MSYS
        update: true
        install: >-
          autotools
          gcc
          make
          pkgconf
          perl
          perl-doc
          zip
          protobuf-devel
          ncurses-devel
          zlib-devel
          openssl-devel

    - name: "build"
      run: |
        export MSYSTEM=CYGWIN
        ./autogen.sh
        CXXFLAGS="-g -O2 -D_GNU_SOURCE" ./configure
        make

    - name: "test"
      run: |
        export MSYSTEM=CYGWIN
        make -C src/tests check TESTS="ocb-aes encrypt-decrypt base64 nonce-incr udp-forward tcp-in-udp tcp-forward"

    - name: "package"
      run: |
        name=mosh-${{ needs.source.outputs.version }}-msys2
        mkdir -p stage/$name dist
        cp src/frontend/mosh-client.exe scripts/mosh COPYING README.md stage/$name/
        strip stage/$name/mosh-client.exe
        ldd src/frontend/mosh-client.exe | awk '$3 ~ /^\/usr\/bin\// { print $3 }' | sort -u | xargs -I{} cp {} stage/$name/
        ls -l stage/$name
        (cd stage && zip -r ../dist/$name.zip $name)

    - name: "check that the packaged client runs on its own"
      shell: pwsh
      run: |
        $dir = Get-ChildItem stage -Directory | Select-Object -First 1
        & "$($dir.FullName)\mosh-client.exe" --version

    - uses: actions/upload-artifact@v4
      with:
        name: msys2
        path: dist/

  publish:
    if: github.ref_type == 'tag'
    needs: [source, linux, msys2]
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: "installer and checksums"
      run: |
        sed 's/@VERSION@/${{ needs.source.outputs.version }}/' scripts/install.sh > dist/install.sh
        cd dist
        sha256sum mosh-* > SHA256SUMS
        cat SHA256SUMS

    # Lets anyone check that a download was built by this workflow from this commit:
    #   gh attestation verify FILE --repo OWNER/REPO
    - uses: actions/attest-build-provenance@v2
      with:
        subject-path: "dist/mosh-*"

    - name: "publish"
      run: |
        gh release create "$GITHUB_REF_NAME" dist/* \
          --prerelease \
          --title "mosh ${{ needs.source.outputs.version }} (experimental port forwarding)" \
          --notes-file .github/release-notes.md
      env:
        GH_TOKEN: ${{ github.token }}
